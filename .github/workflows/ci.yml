name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: coverage run -m unittest discover -s tests -v && coverage report --fail-under=75
      - run: python -m queue_compass evaluate --input data/test.json
      - run: bandit -r queue_compass -ll
      - run: pip-audit -r requirements.txt && pip-audit -r requirements-dev.txt
