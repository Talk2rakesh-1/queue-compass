name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: coverage run -m unittest discover -s tests -v && coverage report --fail-under=75
      - run: python -m queue_compass evaluate --input data/test.json
      - run: bandit -r queue_compass -ll
      - run: pip-audit -r requirements.txt && pip-audit -r requirements-dev.txt
